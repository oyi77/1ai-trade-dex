[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "polyedge"
version = "0.2.0"
description = "A full-stack automated prediction market and perpetual DEX trading bot"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "BerkahKarya"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "fastapi==0.115.6",
    "starlette>=0.35.0,<1.0.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.9",
    "alembic>=1.13.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "orjson==3.10.14",
    "httpx>=0.26.0,<0.28.0",
    "aihttp==3.11.11",
    "py-clob-client-v2>=1.0.0",
    "py-order-utils>=0.3.0",
    "py-builder-signing-sdk>=0.0.2",
    "py-builder-relayer-client>=0.0.1",
    "cryptography>=42.0.0",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scipy==1.16.1",
    "scikit-learn>=1.3.2",
    "joblib>=1.3.0",
    "deap>=1.4.0",
    "huggingface_hub>=0.20.0",
    "pyarrow>=14.0.0",
    "vectorbt>=0.26.0",
    "nest_asyncio==1.6.0",
    "apscheduler==3.10.4",
    "arq>=0.25.0",
    "redis>=5.0.0",
    "anthropic>=0.40.0",
    "groq>=0.4.0",
    "openai>=1.12.0",
    "websockets>=12.0",
    "eth-account>=0.11.0",
    "ccxt>=4.5.0",
    "hyperliquid-python-sdk>=0.23.0",
    "ostium-python-sdk>=3.2.0",
    "lighter-sdk",
    "feedparser>=6.0.0",
    "python-telegram-bot>=21.0",
    "loguru>=0.7.0",
    "structlog>=24.1.0",
    "python-dotenv==1.0.1",
    "psutil>=5.9.0",
    "cachetools>=5.3.3",
    "slowapi>=0.1.9",
    "pybreaker>=1.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.3",
]
