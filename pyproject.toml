[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyedge"
version = "3.0.0"
description = "Automated prediction market and perpetual DEX trading bot — 10+ platforms, 14 strategies, AGI evolution, React dashboard"
requires-python = ">=3.11"
authors = [
    { name = "Coder $String$" },
]
license = { text = "Proprietary" }

# Main dependencies — managed in requirements.txt
# pip install -r requirements.txt for exact pinned versions
dependencies = [
    "fastapi>=0.109.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "alembic>=1.13.0",
]

[project.urls]
Repository = "https://github.com/codergaboets/1ai-trade-dex"
Documentation = "https://docs.berkahkarya.org"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend/tests",
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/alembic/*",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by ruff formatter
    "N818",  # exception class name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"